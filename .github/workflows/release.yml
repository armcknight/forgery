name: release

# Delegates to armcknight/workflows' reusable SwiftPM cask-release pipeline:
# builds, signs+notarizes, tarballs the binary, publishes to the
# armcknight/homebrew-tools tap, and bumps Casks/forgery.rb (or forgery-rc.rb
# for an RC tag). Requires TAP_RELEASE_TOKEN (Contents: read+write on the tap).
# Signing reads the Developer ID certificate from the fastlane match repo
# (readonly), so it also needs the MATCH_PASSWORD + MATCH_DEPLOY_KEY and
# NOTARY_* secrets.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    uses: armcknight/workflows/.github/workflows/swiftpm-cask-release.yml@2
    with:
      cask-name: forgery
      binaries: forgery
      version-file: Sources/forgery/Forgery.swift
      version-regex: '.*static let version = "([^"]+)".*'
      # octokit / git-kit / RequestKit are vendored as git submodules.
      submodules: recursive
      sign: true
      match-git-url: git@github.com:armcknight/fastlane-match.git
      team-id: 29274SF4VL
      bundle-id: io.mcknight.forgery
    secrets: inherit
