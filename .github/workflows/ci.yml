name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # octokit / git-kit / RequestKit are vendored as git submodules, so the
    # reusable checkout must fetch them or `swift build` can't find their manifests.
    uses: armcknight/workflows/.github/workflows/swift-package-ci.yml@1
    with:
      submodules: recursive
